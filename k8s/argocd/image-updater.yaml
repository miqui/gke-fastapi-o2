# Argo CD Image Updater (v1.x) config: watches the Docker Hub repo CI pushes to and, on a
# new tag, patches the Application's Kustomize image overrides directly (the default "argocd"
# write-back method) - no git commits, so neither CI nor Image Updater ever needs push access
# to this repo.
#
# Tag scheme + strategy: CI tags each image <UTC yyyymmddHHMMSS>-<7-char sha> (e.g.
# 20260918140501-a1b2c3d) and the "alphabetical" strategy picks the highest one, i.e. the newest
# build. "newest-build" would be the obvious choice but is documented as unsuitable for Docker
# Hub - it fetches a manifest per tag to read creation dates, and those count against pull limits.
# allowTags excludes the floating :latest tag CI also pushes.
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: fastapi-o2
  namespace: argocd
spec:
  applicationRefs:
    - namePattern: fastapi-o2
      commonUpdateSettings:
        updateStrategy: alphabetical
        allowTags: "regexp:^[0-9]{14}-[0-9a-f]{7}$"
        # Read-only Docker Hub token (created by deploy-kind.sh) so tag polling isn't subject to
        # the anonymous rate limit.
        pullSecret: pullsecret:argocd/dockerhub-image-updater-creds
      images:
        # manifestTargets.kustomize.name is the image name as written in the Deployment specs
        # (k8s/kustomization.yaml renames it to the Docker Hub name) - the override is applied
        # like `kustomize edit set image message-service=docker.io/miqui/rest-message-api:<tag>`.
        - alias: message-service
          imageName: docker.io/miqui/rest-message-api
          manifestTargets:
            kustomize:
              name: message-service
