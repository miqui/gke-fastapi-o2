# Local kind-cluster development credentials only - do not reuse these values
# outside a disposable local cluster.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-credentials
  namespace: observability
  labels:
    app: grafana
type: Opaque
stringData:
  GF_SECURITY_ADMIN_USER: "YOUR_GRAFANA_ADMIN_USER"
  GF_SECURITY_ADMIN_PASSWORD: "YOUR_GRAFANA_ADMIN_PASSWORD"
