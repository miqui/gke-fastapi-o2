# Local kind-cluster development credentials only - do not reuse these values
# outside a disposable local cluster. Must match auth.ZO_ROOT_USER_PASSWORD in
# k8s/observability/openobserve-values.yaml; mounted into Prometheus so
# remote_write's basic_auth.password_file (see config/prometheus.yml) never
# has to put the password in the ConfigMap itself.
apiVersion: v1
kind: Secret
metadata:
  name: openobserve-remote-write-credentials
  namespace: observability
  labels:
    app: prometheus
type: Opaque
stringData:
  password: "YOUR_OPENOBSERVE_ROOT_PASSWORD"
