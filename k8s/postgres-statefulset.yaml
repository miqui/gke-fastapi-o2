apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      nodeSelector:
        workload: db
      securityContext:
        # 70 is the postgres user/group in the postgres:*-alpine images. Data first initialized
        # by the old root-started container is already owned by uid 70 (the entrypoint drops to
        # it), so switching an existing volume to non-root needs no migration - verified by
        # re-opening a root-initialized volume with this exact securityContext. fsGroup is for
        # storage classes that apply it; kind's local-path volumes are world-writable regardless.
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # shared_preload_libraries must be set at server start (can't be done via a plain SQL
          # statement); schema.sql's CREATE EXTENSION IF NOT EXISTS pg_stat_statements then just
          # attaches to this already-preloaded library. pg_stat_statements.track=all also counts
          # statements executed inside functions, not only top-level ones.
          args:
            - "-c"
            - "shared_preload_libraries=pg_stat_statements"
            - "-c"
            - "pg_stat_statements.track=all"
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - configMapRef:
                name: postgres-config
            - secretRef:
                name: postgres-credentials
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          # Wrapped in `sh -c` so $DB_USER/$POSTGRES_DB actually expand via real shell
          # substitution - a bare exec.command (no shell) never expands Kubernetes'
          # $(VAR) syntax, which only applies to a container's own command/args, not
          # probe commands. Without the shell, pg_isready received the literal string
          # "$(DB_USER)" as a role name, which Postgres correctly logged as a FATAL
          # "role does not exist" on every single probe tick - harmless (pg_isready
          # still reports "accepting connections" and exit 0 regardless of the role
          # name given), but noisy, misleading log spam since the first deploy.
          startupProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$DB_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$DB_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$DB_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
        # Sidecar (shares the pod's network namespace, so it reaches Postgres via localhost)
        # exporting pg_stat_database/pg_locks/pg_stat_bgwriter/pg_stat_activity/pg_stat_statements
        # as Prometheus metrics - see https://github.com/prometheus-community/postgres_exporter
        # and the "PostgreSQL Ops & Queries" Grafana dashboard that reads them.
        - name: postgres-exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsUser: 65534
            runAsGroup: 65534
          args:
            - "--collector.stat_statements"
            - "--collector.stat_statements.include_query"
          env:
            - name: DATA_SOURCE_URI
              value: "localhost:5432/messagedb?sslmode=disable"
            - name: DATA_SOURCE_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: DB_USER
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: DB_PASSWORD
          ports:
            - containerPort: 9187
              name: metrics
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9187
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /metrics
              port: 9187
            initialDelaySeconds: 10
            periodSeconds: 15
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
