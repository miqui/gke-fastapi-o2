name: message-service CI

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "migrations/**"
      - "tests/**"
      - "alembic.ini"
      - "pyproject.toml"
      - "uv.lock"
      - "Dockerfile"
      - ".github/workflows/message-service-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "migrations/**"
      - "tests/**"
      - "alembic.ini"
      - "pyproject.toml"
      - "uv.lock"
      - "Dockerfile"
      - ".github/workflows/message-service-ci.yml"
  workflow_dispatch: {}

# Image: us-central1-docker.pkg.dev/<project>/api-images/rest-message-api (Artifact Registry).
# Pushing authenticates keylessly: GitHub's OIDC token is exchanged through Workload Identity
# Federation for a short-lived token of the ci-pusher service account, which can only write to
# that one repository. The federation provider only accepts tokens for this repo's main branch,
# so pull requests (which never push) can't obtain it either. Set up by gke-deploy.sh, which
# prints the two repository variables below.
env:
  REGISTRY: us-central1-docker.pkg.dev
  IMAGE: us-central1-docker.pkg.dev/k8s-dev-412419/api-images/rest-message-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # OIDC token for Workload Identity Federation
    # The integration tests run the real Alembic migration against a real Postgres (Hazelcast is
    # faked). DB_* match the defaults in app/settings.py.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: message_app
          POSTGRES_PASSWORD: message_app
          POSTGRES_DB: messagedb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U message_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check

      - name: Type check
        run: uv run pyright

      - name: Test
        run: uv run pytest

      - name: Set up Docker Buildx
        if: github.event_name != 'pull_request'
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Google Cloud
        if: github.event_name != 'pull_request'
        id: gcp
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SA }}
          token_format: access_token

      - name: Log in to Artifact Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.gcp.outputs.access_token }}

      # <UTC yyyymmddHHMMSS>-<7-char sha>: sorts lexically by build time (Argo CD Image Updater's
      # "alphabetical" strategy picks the highest tag) while still identifying the commit.
      - name: Compute image tag
        if: github.event_name != 'pull_request'
        id: meta
        run: echo "tag=$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # amd64 only: GKE's e2 nodes are x86_64.
      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
